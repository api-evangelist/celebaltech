aid: celebaltech
name: Celebal Technologies
description: 'Celebal Technologies is an enterprise data and AI consulting and engineering
  firm founded in 2016 and headquartered in Jaipur, India, with delivery across 13 countries
  and more than 3,000 certified professionals. It partners with organizations on digital
  transformation across Data Engineering, Generative AI, Machine Learning, Data Science,
  cloud and database migration, SAP Extend & Innovate, app modernization, and enterprise
  cloud integration, building on Microsoft Azure, Databricks, AWS, and SAP. Proprietary
  products include Konverto AI, CT VMS, CT Passport, CT Vision, Eagle Eye IQ, PuFF, and
  Chronify, serving manufacturing, retail & CPG, oil & gas, energy, BFSI, healthcare,
  media & entertainment, public sector, ITES, and education. Surfaced as a portfolio
  company of Norwest Venture Partners; no public API or developer surface was found.'
